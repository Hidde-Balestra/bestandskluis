name: Release

# Start een release door een versie-tag te pushen:
#   git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag voor de release (bijv. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  apk:
    name: Getekende Android-APK
    needs: test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      # De release-sleutel komt uit de repository-secrets. Zonder secrets
      # stopt de release: er wordt nooit een debug-getekende APK uitgebracht.
      - name: Keystore klaarzetten
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing-secrets ontbreken (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - run: flutter pub get

      - name: APK bouwen
        run: |
          VERSION="${TAG#v}"
          flutter build apk --release \
            --build-name="${VERSION%%-*}" \
            --build-number="${{ github.run_number }}"

      # Controleer dat de APK echt met de release-sleutel is getekend door de
      # vingerafdruk van het certificaat te vergelijken met de repo-variabele
      # ANDROID_CERT_SHA256.
      - name: Handtekening controleren
        env:
          EXPECTED: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signing.txt
          ACTUAL=$(grep -m1 'certificate SHA-256 digest' signing.txt | awk '{print $NF}')
          if grep -q 'CN=Android Debug' signing.txt; then
            echo "::error::APK is met de debug-sleutel getekend"; exit 1
          fi
          if [ -n "$EXPECTED" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Onverwacht certificaat: $ACTUAL (verwacht $EXPECTED)"; exit 1
          fi
          echo "Certificaat SHA-256: $ACTUAL"
          echo "CERT_SHA256=$ACTUAL" >> "$GITHUB_ENV"

      - name: Bestanden voorbereiden
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/bestandskluis-${TAG}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: GitHub-release maken
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Bestandskluis ${{ env.TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
          body: |
            **Installeren:** download `bestandskluis-${{ env.TAG }}.apk` hieronder en open het op je Android-toestel.

            Signing-certificaat (SHA-256): `${{ env.CERT_SHA256 }}`
          files: |
            dist/bestandskluis-${{ env.TAG }}.apk
            dist/SHA256SUMS.txt

      - name: Keystore opruimen
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
